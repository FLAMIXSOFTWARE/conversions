name: Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: ['7.4', '8.3']

    steps:
      # Path repo onto this checkout, not Satis: a PR tests its own code, not master.
      - name: Check out code
        uses: actions/checkout@v4
        with:
          path: package

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom
          tools: composer:v2

      # Plain PHP, no flamix/* dependencies: neither Laravel, Satis nor PACKAGES_TOKEN is needed.
      - name: Install dependencies
        run: |
          mkdir app && cd app
          composer init --no-interaction --name=ci/app --stability=dev
          composer config prefer-stable true
          composer config repositories.package '{"type": "path", "url": "${{ github.workspace }}/package", "options": {"symlink": true}}'
          composer require --no-interaction flamix/conversions:@dev
          composer require --no-interaction --dev phpunit/phpunit:"^9.6 || ^12"

      # Symlinked package: ../../autoload.php from phpunit.xml resolves inside package/, hence --bootstrap.
      - name: Run tests
        working-directory: app
        run: >
          ./vendor/bin/phpunit ./vendor/flamix/conversions/tests
          --configuration ./vendor/flamix/conversions/phpunit.xml
          --bootstrap ./vendor/autoload.php
          --testdox
